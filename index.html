<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="styles.css">

  <!-- dm sans font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

  <!-- tailwind cdn script -->
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Frontend Mentor | Bento grid</title> 
</head>

<body id="bg-[#F6F5F6] font-[DM Sans] px-[160px]">
  
  <main id="container" class="grid grid-cols-1 grid-rows-8 md:grid-cols-2 grid-rows-8 gap-4 p-9 lg:grid-cols-4">

    <section id="card1" class="rounded-2xl bg-purple-300 p-6 order-1 row-span-3 md:col-span-2 row-span-4 lg:order-2">1</section>
    <section id="card2" class="rounded-2xl bg-purple-300 p-6 order-2 row-span-2 md:row-span-3 lg:order-5">2</section>
    <section id="card3" class="rounded-2xl bg-purple-300 p-6 order-3 row-span-2 md:row-span-3 lg:order-6">3</section>
    <section id="card4" class="rounded-2xl bg-purple-300 p-6 order-4 row-span-4 md:col-span-2 row-span-6 lg:order-3">4</section>
    <section id="card5" class="rounded-2xl bg-purple-300 p-6 order-5 row-span-4 md:col-span-2 lg:order-8">5</section>
    <section id="card6" class="rounded-2xl bg-purple-300 p-6 order-6 row-span-2 md:col-span-2 lg:order-7">6</section>
    <section id="card7" class="rounded-2xl bg-purple-300 p-6 order-7 row-span-2 md:col-span-1 lg:order-1 row-span-4">7</section>
    <section id="card8" class="rounded-2xl bg-purple-300 p-6 order-8 row-span-3 md:col-span-1 lg:order-4 row-span-4">8</section>
    
  </main>
